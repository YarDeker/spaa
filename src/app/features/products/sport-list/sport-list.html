<div class="sports-container">
  <p style="text-align: center; font-weight: bold; margin-top: 1em; font-size: 1.2em;">{{searchQuery}}</p>
  <div class="search-block">
    <input 
      type="text"
      [(ngModel)]="searchQuery"
      (ngModelChange)="onFilterChange()"
      placeholder="Search..."
    >

    <div>
      <select 
        [(ngModel)]="selectedCategory"
        (change)="onFilterChange()"
      >
        @for(level of levels; track level) {
          <option [value]="level">{{level}}</option>
        }
      </select>
    </div>
    <div>
      <button (click)="resetFilters()">CLEAR</button>
    </div>
  </div>
  <div style="display: grid; place-items: center;">
    <button class="add-item-btn" routerLink="/products/new">ADD NEW</button>
  </div>


  <div class="sport-list" *ngIf="products$ | async as products; else loading">
    @for(item of products; track item.id) {
      <sport-sport-card 
        [activity]="item"
        (action)="handleCardAction(item.id)">
      </sport-sport-card>
    }
  </div>

  </div>
  

<ng-template #loading>
    <p>Loading...</p>
  </ng-template>
